name: Servidores TorBox

on:
  schedule:
    # Una vez por semana (lunes, 04:23 UTC); también se puede lanzar a mano
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar lista de servidores
        run: python scripts/servidores.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servers.json
          git diff --cached --quiet || git commit -m "servidores: actualización automática"
          git push
